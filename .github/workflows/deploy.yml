name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  GCP_REGION: "us-central1"
  ARTIFACT_REGISTRY: "cloud-run-repo"
  FASTAPI_SERVICE_NAME: "fastapi-service"

jobs:
  build-and-deploy-fastapi:
    name: FastAPI Service
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    outputs:
      service_url: ${{ steps.get-url.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Set image tag
        id: image-tag
        run: |
          echo "tag=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/fastapi-service:latest" >> "$GITHUB_OUTPUT"
          echo "tag-sha=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/fastapi-service:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build FastAPI Docker Image
        run: |
          docker build \
            --tag "${{ steps.image-tag.outputs.tag }}" \
            --tag "${{ steps.image-tag.outputs.tag-sha }}" \
            --file ./Dockerfile \
            .

      - name: Push FastAPI image to Artifact Registry
        run: |
          docker push "${{ steps.image-tag.outputs.tag }}"
          docker push "${{ steps.image-tag.outputs.tag-sha }}"

      - name: Deploy FastAPI to Cloud Run
        run: |
          gcloud run deploy "${{ env.FASTAPI_SERVICE_NAME }}" \
            --image "${{ steps.image-tag.outputs.tag }}" \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 5 \
            --set-env-vars "ENVIRONMENT=${{ github.event.inputs.environment || 'dev' }}" \
            --timeout 300s \
            --quiet

      - name: Get FastAPI Service URL
        id: get-url
        run: |
          SERVICE_URL=$(gcloud run services describe "${{ env.FASTAPI_SERVICE_NAME }}" \
            --region "${{ env.GCP_REGION }}" \
            --format='value(status.url)')
          echo "FastAPI deployed at: $SERVICE_URL"
          echo "url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"

      - name: Verify deployment
        run: |
          echo "Verifying live deployment..."
          sleep 10
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.SERVICE_URL }}/health")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Deployment verification succeeded (HTTP $HTTP_CODE)"
          else
            echo "WARNING: Deployment returned HTTP $HTTP_CODE"
          fi
